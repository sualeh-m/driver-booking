openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Internal HGV/Warehouse worker shift booking system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Internal login and current user
  - name: sheets
    description: Booking sheets (depot + worker type + client)
  - name: workers
    description: Worker records (local cache of Vincere)
  - name: grid
    description: The booking grid
  - name: bookings
    description: Booking cells
  - name: audit
    description: Activity / change history
  - name: dashboard
    description: Summary metrics
  - name: reports
    description: KPI reporting metrics
  - name: previews
    description: Phase 1 email / confirmation previews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user with a temporary password (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's name, email or role (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete (e.g. self or last admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset a user's password to a temporary one (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently logged in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets:
    get:
      operationId: listSheets
      tags: [sheets]
      summary: List all booking sheets
      responses:
        "200":
          description: List of sheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sheet"
    post:
      operationId: createSheet
      tags: [sheets]
      summary: Create a new booking sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetInput"
      responses:
        "201":
          description: Created sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sheet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}:
    delete:
      operationId: deleteSheet
      tags: [sheets]
      summary: Delete a whole sheet and all of its bookings (admin only)
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/contacts:
    get:
      operationId: listSheetContacts
      tags: [sheets]
      summary: List client contacts for a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SheetContact"
    post:
      operationId: addSheetContact
      tags: [sheets]
      summary: Add a client contact to a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetContact"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/contacts/{contactId}:
    patch:
      operationId: updateSheetContact
      tags: [sheets]
      summary: Update a contact (e.g. mark as primary)
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetContact"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeSheetContact
      tags: [sheets]
      summary: Remove a contact from a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List or search workers (local table)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter by name, phone, or job role
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a new worker in the local table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/do-not-book:
    get:
      operationId: listDoNotBookWorkers
      tags: [workers]
      summary: List workers currently flagged Do Not Book
      responses:
        "200":
          description: Flagged workers with their total no-show counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DoNotBookWorker"

  /workers/{id}/do-not-book:
    patch:
      operationId: setWorkerDoNotBook
      tags: [workers]
      summary: Set or clear a worker's Do Not Book flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDoNotBookInput"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{id}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get a single worker by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker's editable details (start date is auto-set and never editable)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdateInput"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /leavers:
    get:
      operationId: listLeavers
      tags: [workers]
      summary: List workers who have left, with reason and length of service
      responses:
        "200":
          description: Leavers with leave date, reason and length of service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Leaver"

  /leavers/{workerId}:
    delete:
      operationId: deleteLeaverRecord
      tags: [workers]
      summary: Permanently delete a worker's leaver record(s) (admin only)
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{id}/leave:
    post:
      operationId: markWorkerAsLeaver
      tags: [workers]
      summary: Mark a worker as having left (records a leaver row, sets status to left)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkLeaverInput"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{id}/restore:
    post:
      operationId: restoreWorker
      tags: [workers]
      summary: Restore a leaver to active/bookable (reverses a mistaken leave)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /requirements:
    get:
      operationId: listRequirements
      tags: [submissions]
      summary: List shift requirements (read-only, for linking submissions)
      parameters:
        - name: sheetId
          in: query
          required: false
          schema:
            type: integer
          description: Optionally restrict to a single sheet
      responses:
        "200":
          description: Shift requirements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requirement"

  /requirements/daily:
    put:
      operationId: upsertDailyRequirement
      tags: [submissions]
      summary: Set the total number of workers required for a sheet on a date
      description: >-
        Sets the per-day requirement total for a sheet+date (used by the grid's
        editable "Required" row). Maintains a single canonical requirement row
        per sheet+date so the grid total matches the entered value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyRequirementInput"
      responses:
        "200":
          description: Saved per-day requirement total
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayRequirement"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /submissions:
    get:
      operationId: listSubmissions
      tags: [submissions]
      summary: List submissions, optionally filtered by sheet and date range
      parameters:
        - name: sheetId
          in: query
          required: false
          schema:
            type: integer
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: Earliest submitted date YYYY-MM-DD (inclusive)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: Latest submitted date YYYY-MM-DD (inclusive)
      responses:
        "200":
          description: Submissions with worker, requirement and outcome
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
    post:
      operationId: createSubmission
      tags: [submissions]
      summary: Record a worker submission (put forward to a client)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "200":
          description: Created submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /submissions/{id}:
    patch:
      operationId: updateSubmissionOutcome
      tags: [submissions]
      summary: Change the outcome of an existing submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionOutcomeInput"
      responses:
        "200":
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/workers:
    post:
      operationId: addWorkerToSheet
      tags: [sheets]
      summary: Link a worker to a sheet (add them to the grid)
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkerToSheetInput"
      responses:
        "204":
          description: Linked
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/workers/{workerId}:
    delete:
      operationId: removeWorkerFromSheet
      tags: [sheets]
      summary: Remove a worker from a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /grid:
    get:
      operationId: getGrid
      tags: [grid]
      summary: Get workers and bookings for a sheet within a date range
      parameters:
        - name: sheetId
          in: query
          required: true
          schema:
            type: integer
        - name: start
          in: query
          required: true
          schema:
            type: string
          description: Start date YYYY-MM-DD (inclusive)
        - name: end
          in: query
          required: true
          schema:
            type: string
          description: End date YYYY-MM-DD (inclusive)
      responses:
        "200":
          description: Grid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings:
    put:
      operationId: upsertBooking
      tags: [bookings]
      summary: Create or update a booking cell for a worker on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "200":
          description: Saved booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/batch:
    put:
      operationId: upsertBookingsBatch
      tags: [bookings]
      summary: Create or update many booking cells at once (drag-fill)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchBookingInput"
      responses:
        "200":
          description: Per-cell result of the batch apply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchBookingResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{id}:
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking cell
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Recent booking change history
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max entries to return (default 100)
      responses:
        "200":
          description: Audit entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level booking metrics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /reports/operational:
    get:
      operationId: getOperationalMetrics
      tags: [reports]
      summary: Operational KPI metrics for a date range, filtered by depot/client and worker type
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive range start (YYYY-MM-DD)
          schema: { type: string }
        - name: end
          in: query
          required: true
          description: Inclusive range end (YYYY-MM-DD)
          schema: { type: string }
        - name: workerType
          in: query
          required: false
          description: Restrict to a single worker type. Omit for both (All).
          schema:
            type: string
            enum: [HGV, Warehouse]
        - name: sheetIds
          in: query
          required: false
          description: Comma-separated sheet IDs to include (the ticked depot/client sheets). Omit for all sheets.
          schema: { type: string }
      responses:
        "200":
          description: Operational metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationalMetrics"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /reports/people:
    get:
      operationId: getPeopleMetrics
      tags: [reports]
      summary: People KPI metrics for a date range, filtered by depot/client and worker type
      parameters:
        - name: start
          in: query
          required: true
          description: Inclusive range start (YYYY-MM-DD)
          schema: { type: string }
        - name: end
          in: query
          required: true
          description: Inclusive range end (YYYY-MM-DD)
          schema: { type: string }
        - name: workerType
          in: query
          required: false
          description: Restrict to a single worker type. Omit for both (All).
          schema:
            type: string
            enum: [HGV, Warehouse]
        - name: sheetIds
          in: query
          required: false
          description: Comma-separated sheet IDs to include (the ticked depot/client sheets). Omit for all sheets.
          schema: { type: string }
      responses:
        "200":
          description: People metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeopleMetrics"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /previews/client-email:
    post:
      operationId: previewClientEmail
      tags: [previews]
      summary: Build the client email preview for a sheet and date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEmailPreviewInput"
      responses:
        "200":
          description: Email preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmailPreview"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /previews/confirmations:
    post:
      operationId: previewConfirmations
      tags: [previews]
      summary: Build candidate confirmation previews (all workers or one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationPreviewInput"
      responses:
        "200":
          description: Confirmation previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfirmationPreview"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /import:
    post:
      operationId: importBookings
      tags: [grid]
      summary: Import workers and bookings from CSV text into a sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    post:
      operationId: createEvent
      tags: [events]
      summary: Log a worker event (no-show, CPC failure, test failure)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid request (e.g. CPC/Test failure on a non-HGV worker)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{workerId}/events:
    get:
      operationId: listWorkerEvents
      tags: [events]
      summary: List events logged against a worker, most recent first
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Events for the worker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a logged event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{workerId}/no-shows/{shiftDate}:
    delete:
      operationId: clearNoShow
      tags: [events]
      summary: Remove the logged no-show(s) for a worker on a date
      description: >-
        Deletes any no_show events for the worker on the given date. Used when a
        booking cell that shows a no-show is cleared, so the no-show never
        outlives its cell. If this drops the worker below the no-show auto-flag
        threshold and they had been auto-flagged Do Not Book, that flag is
        reversed (manual flags are left untouched).
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
        - name: shiftDate
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Result of clearing the no-show
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoShowClearResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Status:
      type: string
      enum: [Available, Pre-Booked, Rest, Off, Holiday, Confirmed]

    WorkerType:
      type: string
      enum: [HGV, Warehouse]

    SheetWorkerType:
      type: string
      description: >-
        Worker type for a sheet. 'Both' means the sheet runs HGV and warehouse
        work together. Workers themselves are only ever HGV or Warehouse.
      enum: [HGV, Warehouse, Both]

    JobRole:
      type: string
      description: >-
        A worker's job role. The rest-day rule applies only to the HGV-type
        roles (HGV 1, HGV 2, Trunker).
      enum: ["HGV 1", "HGV 2", "Trunker", "Van", "Forklift", "Drivers Mate", "Warehouse", "Other"]

    EventType:
      type: string
      description: >-
        Worker event type. cpc_failure and test_failure may only be logged
        against HGV workers; no_show applies to any worker.
      enum: [no_show, cpc_failure, test_failure]

    Event:
      type: object
      required: [id, workerId, eventDate, eventType, createdAt]
      properties:
        id: { type: integer }
        workerId: { type: integer }
        sheetId: { type: ["integer", "null"] }
        eventDate: { type: string }
        eventType: { $ref: "#/components/schemas/EventType" }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["integer", "null"] }
        createdAt: { type: string }
        autoFlagged:
          type: boolean
          description: >-
            Only set on create. True when logging this no-show pushed the worker
            to the no-show threshold and auto-set their Do Not Book flag.

    EventInput:
      type: object
      required: [workerId, eventDate, eventType]
      properties:
        workerId: { type: integer }
        sheetId: { type: ["integer", "null"] }
        eventDate: { type: string, minLength: 1 }
        eventType: { $ref: "#/components/schemas/EventType" }
        notes: { type: string }

    User:
      type: object
      required: [id, name, email, role, mustChangePassword, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        mustChangePassword: { type: boolean }
        createdAt: { type: string }

    UserRole:
      type: string
      enum: [admin, standard]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    CreateUserInput:
      type: object
      required: [name, email, role, temporaryPassword]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/UserRole" }
        temporaryPassword: { type: string, minLength: 8 }

    UpdateUserInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/UserRole" }

    ResetPasswordInput:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword: { type: string, minLength: 8 }

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }

    Sheet:
      type: object
      required: [id, name, clientCompany, workerType, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        clientCompany: { type: string }
        depot: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/SheetWorkerType" }
        createdAt: { type: string }

    SheetInput:
      type: object
      required: [clientCompany, workerType]
      properties:
        clientCompany: { type: string, minLength: 1 }
        depot: { type: string }
        workerType: { $ref: "#/components/schemas/SheetWorkerType" }

    SheetContact:
      type: object
      required: [id, sheetId, email, isPrimary]
      properties:
        id: { type: integer }
        sheetId: { type: integer }
        contactName: { type: ["string", "null"] }
        email: { type: string }
        isPrimary: { type: boolean }

    SheetContactInput:
      type: object
      required: [email]
      properties:
        contactName: { type: string }
        email: { type: string, minLength: 1 }
        isPrimary: { type: boolean }

    SheetContactUpdate:
      type: object
      required: [isPrimary]
      properties:
        isPrimary: { type: boolean }

    Worker:
      type: object
      required: [id, fullName, workerType, status, doNotBook, syncedAt]
      properties:
        id: { type: integer }
        vincereId: { type: ["string", "null"] }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: ["string", "null"] }
        status: { type: string }
        doNotBook: { type: boolean }
        syncedAt: { type: string }

    WorkerInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        jobRole: { $ref: "#/components/schemas/JobRole" }
        startDate: { type: string }
        vincereId: { type: string }

    WorkerUpdateInput:
      type: object
      required: [fullName]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: ["string", "null"] }
        jobRole:
          anyOf:
            - $ref: "#/components/schemas/JobRole"
            - type: "null"
        note: { type: ["string", "null"] }
        sheetId: { type: integer }

    AddWorkerToSheetInput:
      type: object
      required: [workerId]
      properties:
        workerId: { type: integer }
        notes: { type: string }

    GridWorker:
      type: object
      required: [id, fullName, workerType, status, doNotBook, syncedAt]
      properties:
        id: { type: integer }
        vincereId: { type: ["string", "null"] }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: ["string", "null"] }
        status: { type: string }
        doNotBook: { type: boolean }
        syncedAt: { type: string }
        note: { type: ["string", "null"] }

    DoNotBookWorker:
      type: object
      required: [id, fullName, workerType, doNotBook, noShowCount]
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        doNotBook: { type: boolean }
        noShowCount: { type: integer }

    SetDoNotBookInput:
      type: object
      required: [doNotBook]
      properties:
        doNotBook: { type: boolean }

    LeaverReason:
      type: string
      enum:
        - low_rates
        - travel_distance
        - permanent_employment
        - shift_pattern
        - performance_issues
        - attendance_issues
        - other

    Leaver:
      type: object
      required: [workerId, fullName, workerType, leaveDate, reason, serviceDays]
      properties:
        workerId: { type: integer }
        fullName: { type: string }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: ["string", "null"] }
        leaveDate: { type: string }
        reason: { $ref: "#/components/schemas/LeaverReason" }
        notes: { type: ["string", "null"] }
        serviceDays:
          type: ["integer", "null"]
          description: Days from start_date (first booking) to leave_date; null when the worker never had a booking ("not started").

    MarkLeaverInput:
      type: object
      required: [leaveDate, reason]
      properties:
        leaveDate: { type: string }
        reason: { $ref: "#/components/schemas/LeaverReason" }
        notes: { type: string }

    SubmissionOutcome:
      type: string
      enum:
        - submitted
        - passed
        - rejected

    Requirement:
      type: object
      required: [id, sheetId, reqDate, quantityNeeded]
      properties:
        id: { type: integer }
        sheetId: { type: integer }
        reqDate: { type: string }
        jobRole: { type: ["string", "null"] }
        quantityNeeded: { type: integer }

    Submission:
      type: object
      required: [id, workerId, workerName, submittedDate, outcome]
      properties:
        id: { type: integer }
        workerId: { type: integer }
        workerName: { type: string }
        submittedDate: { type: string }
        outcome: { $ref: "#/components/schemas/SubmissionOutcome" }
        sheetId: { type: ["integer", "null"] }
        sheetName: { type: ["string", "null"] }
        requirementId: { type: ["integer", "null"] }
        requirementReqDate: { type: ["string", "null"] }
        requirementJobRole: { type: ["string", "null"] }
        requirementQuantityNeeded:
          type: ["integer", "null"]
          description: How many workers this requirement needed (null when not linked to a requirement).
        requirementSubmittedCount:
          type: ["integer", "null"]
          description: Total submissions recorded against this requirement (null when not linked).

    SubmissionInput:
      type: object
      required: [workerId, submittedDate, outcome]
      properties:
        workerId: { type: integer }
        submittedDate: { type: string }
        outcome: { $ref: "#/components/schemas/SubmissionOutcome" }
        requirementId: { type: integer }
        sheetId: { type: integer }

    UpdateSubmissionOutcomeInput:
      type: object
      required: [outcome]
      properties:
        outcome: { $ref: "#/components/schemas/SubmissionOutcome" }

    Booking:
      type: object
      required: [id, workerId, sheetId, shiftDate, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workerId: { type: integer }
        sheetId: { type: integer }
        shiftDate: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        startTime: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        createdBy: { type: ["integer", "null"] }
        updatedBy: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    BookingInput:
      type: object
      required: [workerId, sheetId, shiftDate, status]
      properties:
        workerId: { type: integer }
        sheetId: { type: integer }
        shiftDate: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        startTime: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        acknowledgeRestWarning:
          type: boolean
          description: >-
            Set true to confirm an HGV rest-day warning and save anyway. Ignored
            for Warehouse workers and for bookings below the warn threshold.

    BatchBookingCell:
      type: object
      required: [workerId, shiftDate]
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }

    BatchBookingInput:
      type: object
      required: [sheetId, status, cells]
      properties:
        sheetId: { type: integer }
        status: { $ref: "#/components/schemas/Status" }
        startTime: { type: ["string", "null"] }
        note: { type: ["string", "null"] }
        cells:
          type: array
          items: { $ref: "#/components/schemas/BatchBookingCell" }
        acknowledgeRestWarning:
          type: boolean
          description: >-
            Set true to confirm HGV rest-day warnings and save the warned cells
            anyway. Blocked cells (at the block threshold) are never saved.

    BatchBookingResultCell:
      type: object
      required: [workerId, shiftDate, workerName, consecutiveDays]
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }
        workerName: { type: string }
        consecutiveDays: { type: integer }

    BatchBookingResult:
      type: object
      required: [applied, warnings, blocked, conflicts]
      description: >-
        Outcome of a drag-fill apply, split per cell. applied = saved;
        warnings = HGV cells at the warn threshold not yet saved (resubmit with
        acknowledgeRestWarning to save them); blocked = HGV cells at the block
        threshold that cannot be saved; conflicts = cells skipped because the
        worker is already working (Confirmed/Pre-Booked) on another sheet that
        day (a hard cross-sheet double-booking block).
      properties:
        applied:
          type: array
          items: { $ref: "#/components/schemas/BatchBookingResultCell" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/BatchBookingResultCell" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/BatchBookingResultCell" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/BatchBookingResultCell" }

    RestCounter:
      type: object
      required: [workerId, shiftDate, days]
      description: Consecutive working days ending on a date (HGV workers only).
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }
        days: { type: integer }

    NoShowCell:
      type: object
      required: [workerId, shiftDate]
      description: A logged no-show event for a worker on a date (display only).
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }

    NoShowClearResult:
      type: object
      required: [removed, autoUnflagged]
      description: Outcome of clearing a worker's no-show(s) on a date.
      properties:
        removed:
          type: integer
          description: Number of no_show events deleted.
        autoUnflagged:
          type: boolean
          description: >-
            True when removing the no-show dropped the worker below the auto-flag
            threshold and reversed an automatic Do Not Book flag.

    DayRequirement:
      type: object
      required: [shiftDate, required]
      description: Total quantity needed for a sheet on a date (all roles summed).
      properties:
        shiftDate: { type: string }
        required: { type: integer }

    DailyRequirementInput:
      type: object
      required: [sheetId, shiftDate, required]
      description: Set the total workers required for a sheet on a date.
      properties:
        sheetId: { type: integer }
        shiftDate: { type: string }
        required:
          type: integer
          minimum: 0
          description: Total workers needed that day (0 clears the requirement).

    GridResponse:
      type: object
      required: [workers, bookings, restCounters, noShows, requirements]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/GridWorker"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        restCounters:
          type: array
          description: Consecutive-working-day counters for HGV workers' worked days.
          items:
            $ref: "#/components/schemas/RestCounter"
        noShows:
          type: array
          description: No-show events in the window so cells can render red (display only).
          items:
            $ref: "#/components/schemas/NoShowCell"
        requirements:
          type: array
          description: Per-day total quantity needed for the sheet (all roles summed).
          items:
            $ref: "#/components/schemas/DayRequirement"

    AuditEntry:
      type: object
      required: [id, action, changedAt]
      properties:
        id: { type: integer }
        bookingId: { type: ["integer", "null"] }
        userId: { type: ["integer", "null"] }
        userName: { type: ["string", "null"] }
        workerName: { type: ["string", "null"] }
        shiftDate: { type: ["string", "null"] }
        action: { type: string }
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        changedAt: { type: string }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }

    DashboardSummary:
      type: object
      required: [totalWorkers, totalActiveWorkers, totalSheets, shiftsToday, shiftsThisWeek, statusBreakdown]
      properties:
        totalWorkers: { type: integer }
        totalActiveWorkers: { type: integer }
        totalSheets: { type: integer }
        shiftsToday: { type: integer }
        shiftsThisWeek: { type: integer }
        statusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"

    OperationalMetrics:
      type: object
      required: [start, end, activeWorkers, requirementsReceived, filled, fillRate, noShows]
      properties:
        start: { type: string }
        end: { type: string }
        activeWorkers: { type: integer }
        requirementsReceived: { type: integer }
        filled: { type: integer }
        fillRate:
          type: ["number", "null"]
          description: filled / requirementsReceived as a percentage (0-100+). Null when no requirements in range.
        noShows: { type: integer }

    LeaverReasonCount:
      type: object
      required: [reason, count]
      properties:
        reason: { $ref: "#/components/schemas/LeaverReason" }
        count: { type: integer }

    RetentionBucket:
      type: object
      required: [bucket, count]
      properties:
        bucket:
          type: string
          enum: [under_1_week, 1_4_weeks, 1_3_months, 3_6_months, 6_months_plus]
        count: { type: integer }

    PeopleMetrics:
      type: object
      required:
        [
          start,
          end,
          submitted,
          passed,
          passRate,
          leavers,
          leaverReasons,
          retention,
          notStarted,
          cpcFailures,
          testFailures,
        ]
      properties:
        start: { type: string }
        end: { type: string }
        submitted: { type: integer }
        passed: { type: integer }
        passRate:
          type: ["number", "null"]
          description: passed / submitted as a percentage (0-100). Null when no submissions in range.
        leavers: { type: integer }
        leaverReasons:
          type: array
          description: Count of leavers in range grouped by reason (all reasons present, including zeros).
          items:
            $ref: "#/components/schemas/LeaverReasonCount"
        retention:
          type: array
          description: >-
            Count of workers (with a start date, matching depot/client + worker type)
            by length of service, as a current snapshot (not date-range bound). Service
            runs start_date→leave_date for leavers, start_date→today for active workers.
          items:
            $ref: "#/components/schemas/RetentionBucket"
        notStarted:
          type: integer
          description: Workers matching the filters that have no start_date (never booked); excluded from retention buckets.
        cpcFailures: { type: integer }
        testFailures: { type: integer }

    ClientEmailPreviewInput:
      type: object
      required: [sheetId, start, end]
      properties:
        sheetId: { type: integer }
        start: { type: string }
        end: { type: string }

    ClientEmailRow:
      type: object
      required: [workerName, shiftDate, status]
      properties:
        workerName: { type: string }
        jobRole: { type: ["string", "null"] }
        shiftDate: { type: string }
        status: { type: string }
        startTime: { type: ["string", "null"] }

    ClientEmailPreview:
      type: object
      required: [subject, body, clientCompany, rows]
      properties:
        subject: { type: string }
        body: { type: string }
        clientCompany: { type: string }
        depot: { type: ["string", "null"] }
        recipientName: { type: ["string", "null"] }
        recipientEmail: { type: ["string", "null"] }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ClientEmailRow"

    ConfirmationPreviewInput:
      type: object
      required: [start, end]
      properties:
        workerId: { type: ["integer", "null"] }
        sheetId: { type: ["integer", "null"] }
        start: { type: string }
        end: { type: string }

    ConfirmationShift:
      type: object
      required: [shiftDate, status]
      properties:
        shiftDate: { type: string }
        status: { type: string }
        startTime: { type: ["string", "null"] }
        sheetName: { type: ["string", "null"] }
        clientCompany: { type: ["string", "null"] }
        depot: { type: ["string", "null"] }

    ConfirmationPreview:
      type: object
      required: [workerId, workerName, messageText, shifts]
      properties:
        workerId: { type: integer }
        workerName: { type: string }
        phone: { type: ["string", "null"] }
        messageText: { type: string }
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationShift"

    ImportInput:
      type: object
      required: [sheetId, csvText]
      properties:
        sheetId: { type: integer }
        csvText: { type: string }

