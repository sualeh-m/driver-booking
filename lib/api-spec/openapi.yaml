openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Internal HGV/Warehouse worker shift booking system
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Internal login and current user
  - name: sheets
    description: Booking sheets (depot + worker type + client)
  - name: workers
    description: Worker records (local cache of Vincere)
  - name: grid
    description: The booking grid
  - name: bookings
    description: Booking cells
  - name: audit
    description: Activity / change history
  - name: dashboard
    description: Summary metrics
  - name: previews
    description: Phase 1 email / confirmation previews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [auth]
      summary: List account managers (for pick-your-name login)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in by selecting a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently logged in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets:
    get:
      operationId: listSheets
      tags: [sheets]
      summary: List all booking sheets
      responses:
        "200":
          description: List of sheets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sheet"
    post:
      operationId: createSheet
      tags: [sheets]
      summary: Create a new booking sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetInput"
      responses:
        "201":
          description: Created sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sheet"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/contacts:
    get:
      operationId: listSheetContacts
      tags: [sheets]
      summary: List client contacts for a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SheetContact"
    post:
      operationId: addSheetContact
      tags: [sheets]
      summary: Add a client contact to a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetContactInput"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetContact"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/contacts/{contactId}:
    patch:
      operationId: updateSheetContact
      tags: [sheets]
      summary: Update a contact (e.g. mark as primary)
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SheetContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetContact"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: removeSheetContact
      tags: [sheets]
      summary: Remove a contact from a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: contactId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List or search workers (local table)
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter by name, phone, or job role
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a new worker in the local table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/do-not-book:
    get:
      operationId: listDoNotBookWorkers
      tags: [workers]
      summary: List workers currently flagged Do Not Book
      responses:
        "200":
          description: Flagged workers with their total no-show counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DoNotBookWorker"

  /workers/{id}/do-not-book:
    patch:
      operationId: setWorkerDoNotBook
      tags: [workers]
      summary: Set or clear a worker's Do Not Book flag
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDoNotBookInput"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/workers:
    post:
      operationId: addWorkerToSheet
      tags: [sheets]
      summary: Link a worker to a sheet (add them to the grid)
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWorkerToSheetInput"
      responses:
        "204":
          description: Linked
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sheets/{sheetId}/workers/{workerId}:
    delete:
      operationId: removeWorkerFromSheet
      tags: [sheets]
      summary: Remove a worker from a sheet
      parameters:
        - name: sheetId
          in: path
          required: true
          schema:
            type: integer
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /grid:
    get:
      operationId: getGrid
      tags: [grid]
      summary: Get workers and bookings for a sheet within a date range
      parameters:
        - name: sheetId
          in: query
          required: true
          schema:
            type: integer
        - name: start
          in: query
          required: true
          schema:
            type: string
          description: Start date YYYY-MM-DD (inclusive)
        - name: end
          in: query
          required: true
          schema:
            type: string
          description: End date YYYY-MM-DD (inclusive)
      responses:
        "200":
          description: Grid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings:
    put:
      operationId: upsertBooking
      tags: [bookings]
      summary: Create or update a booking cell for a worker on a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "200":
          description: Saved booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{id}:
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking cell
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit:
    get:
      operationId: listAudit
      tags: [audit]
      summary: Recent booking change history
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max entries to return (default 100)
      responses:
        "200":
          description: Audit entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Top-level booking metrics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /previews/client-email:
    post:
      operationId: previewClientEmail
      tags: [previews]
      summary: Build the client email preview for a sheet and date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEmailPreviewInput"
      responses:
        "200":
          description: Email preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEmailPreview"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /previews/confirmations:
    post:
      operationId: previewConfirmations
      tags: [previews]
      summary: Build candidate confirmation previews (all workers or one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmationPreviewInput"
      responses:
        "200":
          description: Confirmation previews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfirmationPreview"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /import:
    post:
      operationId: importBookings
      tags: [grid]
      summary: Import workers and bookings from CSV text into a sheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /events:
    post:
      operationId: createEvent
      tags: [events]
      summary: Log a worker event (no-show, CPC failure, test failure)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid request (e.g. CPC/Test failure on a non-HGV worker)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workers/{workerId}/events:
    get:
      operationId: listWorkerEvents
      tags: [events]
      summary: List events logged against a worker, most recent first
      parameters:
        - name: workerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Events for the worker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a logged event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Status:
      type: string
      enum: [Available, Pre-Booked, Rest, Off, Holiday, Confirmed]

    WorkerType:
      type: string
      enum: [HGV, Warehouse]

    EventType:
      type: string
      description: >-
        Worker event type. cpc_failure and test_failure may only be logged
        against HGV workers; no_show applies to any worker.
      enum: [no_show, cpc_failure, test_failure]

    Event:
      type: object
      required: [id, workerId, eventDate, eventType, createdAt]
      properties:
        id: { type: integer }
        workerId: { type: integer }
        sheetId: { type: ["integer", "null"] }
        eventDate: { type: string }
        eventType: { $ref: "#/components/schemas/EventType" }
        notes: { type: ["string", "null"] }
        createdBy: { type: ["integer", "null"] }
        createdAt: { type: string }
        autoFlagged:
          type: boolean
          description: >-
            Only set on create. True when logging this no-show pushed the worker
            to the no-show threshold and auto-set their Do Not Book flag.

    EventInput:
      type: object
      required: [workerId, eventDate, eventType]
      properties:
        workerId: { type: integer }
        sheetId: { type: ["integer", "null"] }
        eventDate: { type: string, minLength: 1 }
        eventType: { $ref: "#/components/schemas/EventType" }
        notes: { type: string }

    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        createdAt: { type: string }

    LoginInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }

    Sheet:
      type: object
      required: [id, name, clientCompany, workerType, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        clientCompany: { type: string }
        depot: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        createdAt: { type: string }

    SheetInput:
      type: object
      required: [name, clientCompany, workerType]
      properties:
        name: { type: string, minLength: 1 }
        clientCompany: { type: string, minLength: 1 }
        depot: { type: string }
        workerType: { $ref: "#/components/schemas/WorkerType" }

    SheetContact:
      type: object
      required: [id, sheetId, email, isPrimary]
      properties:
        id: { type: integer }
        sheetId: { type: integer }
        contactName: { type: ["string", "null"] }
        email: { type: string }
        isPrimary: { type: boolean }

    SheetContactInput:
      type: object
      required: [email]
      properties:
        contactName: { type: string }
        email: { type: string, minLength: 1 }
        isPrimary: { type: boolean }

    SheetContactUpdate:
      type: object
      required: [isPrimary]
      properties:
        isPrimary: { type: boolean }

    Worker:
      type: object
      required: [id, fullName, workerType, status, doNotBook, syncedAt]
      properties:
        id: { type: integer }
        vincereId: { type: ["string", "null"] }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: ["string", "null"] }
        status: { type: string }
        doNotBook: { type: boolean }
        syncedAt: { type: string }

    WorkerInput:
      type: object
      required: [fullName, workerType]
      properties:
        fullName: { type: string, minLength: 1 }
        phone: { type: string }
        jobRole: { type: string }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: string }
        vincereId: { type: string }

    AddWorkerToSheetInput:
      type: object
      required: [workerId]
      properties:
        workerId: { type: integer }
        notes: { type: string }

    GridWorker:
      type: object
      required: [id, fullName, workerType, status, doNotBook, syncedAt]
      properties:
        id: { type: integer }
        vincereId: { type: ["string", "null"] }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        startDate: { type: ["string", "null"] }
        status: { type: string }
        doNotBook: { type: boolean }
        syncedAt: { type: string }
        note: { type: ["string", "null"] }

    DoNotBookWorker:
      type: object
      required: [id, fullName, workerType, doNotBook, noShowCount]
      properties:
        id: { type: integer }
        fullName: { type: string }
        phone: { type: ["string", "null"] }
        jobRole: { type: ["string", "null"] }
        workerType: { $ref: "#/components/schemas/WorkerType" }
        doNotBook: { type: boolean }
        noShowCount: { type: integer }

    SetDoNotBookInput:
      type: object
      required: [doNotBook]
      properties:
        doNotBook: { type: boolean }

    Booking:
      type: object
      required: [id, workerId, sheetId, shiftDate, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        workerId: { type: integer }
        sheetId: { type: integer }
        shiftDate: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        startTime: { type: ["string", "null"] }
        createdBy: { type: ["integer", "null"] }
        updatedBy: { type: ["integer", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    BookingInput:
      type: object
      required: [workerId, sheetId, shiftDate, status]
      properties:
        workerId: { type: integer }
        sheetId: { type: integer }
        shiftDate: { type: string }
        status: { $ref: "#/components/schemas/Status" }
        startTime: { type: ["string", "null"] }
        acknowledgeRestWarning:
          type: boolean
          description: >-
            Set true to confirm an HGV rest-day warning and save anyway. Ignored
            for Warehouse workers and for bookings below the warn threshold.

    RestCounter:
      type: object
      required: [workerId, shiftDate, days]
      description: Consecutive working days ending on a date (HGV workers only).
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }
        days: { type: integer }

    NoShowCell:
      type: object
      required: [workerId, shiftDate]
      description: A logged no-show event for a worker on a date (display only).
      properties:
        workerId: { type: integer }
        shiftDate: { type: string }

    GridResponse:
      type: object
      required: [workers, bookings, restCounters, noShows]
      properties:
        workers:
          type: array
          items:
            $ref: "#/components/schemas/GridWorker"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        restCounters:
          type: array
          description: Consecutive-working-day counters for HGV workers' worked days.
          items:
            $ref: "#/components/schemas/RestCounter"
        noShows:
          type: array
          description: No-show events in the window so cells can render red (display only).
          items:
            $ref: "#/components/schemas/NoShowCell"

    AuditEntry:
      type: object
      required: [id, action, changedAt]
      properties:
        id: { type: integer }
        bookingId: { type: ["integer", "null"] }
        userId: { type: ["integer", "null"] }
        userName: { type: ["string", "null"] }
        workerName: { type: ["string", "null"] }
        shiftDate: { type: ["string", "null"] }
        action: { type: string }
        oldValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        changedAt: { type: string }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { type: string }
        count: { type: integer }

    DashboardSummary:
      type: object
      required: [totalWorkers, totalActiveWorkers, totalSheets, shiftsToday, shiftsThisWeek, statusBreakdown]
      properties:
        totalWorkers: { type: integer }
        totalActiveWorkers: { type: integer }
        totalSheets: { type: integer }
        shiftsToday: { type: integer }
        shiftsThisWeek: { type: integer }
        statusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/StatusCount"

    ClientEmailPreviewInput:
      type: object
      required: [sheetId, start, end]
      properties:
        sheetId: { type: integer }
        start: { type: string }
        end: { type: string }

    ClientEmailRow:
      type: object
      required: [workerName, shiftDate, status]
      properties:
        workerName: { type: string }
        jobRole: { type: ["string", "null"] }
        shiftDate: { type: string }
        status: { type: string }
        startTime: { type: ["string", "null"] }

    ClientEmailPreview:
      type: object
      required: [subject, body, clientCompany, rows]
      properties:
        subject: { type: string }
        body: { type: string }
        clientCompany: { type: string }
        depot: { type: ["string", "null"] }
        recipientName: { type: ["string", "null"] }
        recipientEmail: { type: ["string", "null"] }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ClientEmailRow"

    ConfirmationPreviewInput:
      type: object
      required: [start, end]
      properties:
        workerId: { type: ["integer", "null"] }
        sheetId: { type: ["integer", "null"] }
        start: { type: string }
        end: { type: string }

    ConfirmationShift:
      type: object
      required: [shiftDate, status]
      properties:
        shiftDate: { type: string }
        status: { type: string }
        startTime: { type: ["string", "null"] }
        sheetName: { type: ["string", "null"] }
        clientCompany: { type: ["string", "null"] }
        depot: { type: ["string", "null"] }

    ConfirmationPreview:
      type: object
      required: [workerId, workerName, messageText, shifts]
      properties:
        workerId: { type: integer }
        workerName: { type: string }
        phone: { type: ["string", "null"] }
        messageText: { type: string }
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/ConfirmationShift"

    ImportInput:
      type: object
      required: [sheetId, csvText]
      properties:
        sheetId: { type: integer }
        csvText: { type: string }

    ImportResult:
      type: object
      required: [workersCreated, workersMatched, bookingsUpserted, errors]
      properties:
        workersCreated: { type: integer }
        workersMatched: { type: integer }
        bookingsUpserted: { type: integer }
        errors:
          type: array
          items:
            type: string
